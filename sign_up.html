<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  background: #fff;
  padding: 20px;
  min-height: 100vh;
}

.container {
  max-width: 1200px;
  margin:auto;
  display: flex;
  flex-direction: column;
  gap: 30px;
}

/* Header with logo and help */
.header {
    width:100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
}

/* Logo */
.logo img {
  max-width: 150px;
}

/* Helpline Box */
.helpline-box {
  position: relative;

}

.help-btn {
  background-color: #7c4dff;
  color: white;
  padding: 10px 20px;
  border-radius: 25px;
  border: none;
  cursor: pointer;
  font-size: 14px;
}

.popup {
  display: none;
  position: absolute;
  top: 80px;
  right: 0;
  width: 300px;
  color: #333;
  padding: 20px;
  border-radius: 10px;
  z-index: 100;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}

.popup.show {
  display: block;
}

.popup h3 {
  margin-bottom: 10px;
}

.popup p {
  margin: 10px 0;
}

.popup button {
  margin-top: 10px;
  padding: 8px 16px;
  background: #ff8500;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}


/* Form Styling */
.form-box {
  background: #fff;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
}

.form-box h2 {
  margin-bottom: 20px;
  font-size: 26px;
  text-align: center;
}

form label {
  font-weight: 600;
  display: block;
  margin-top: 15px;
  margin-bottom: 5px;
}

form label span {
  color: red;
}

form input,
form select {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
  margin-bottom: 10px;
}

.phone-box {
  display: flex;
  align-items: center;
  gap: 10px;
}

.phone-box span {
  padding: 12px;
  background: #eee;
  border-radius: 8px;
  font-weight: bold;
  border: 1px solid #ccc;
}

.phone-box input {
  flex: 1;
  margin-bottom: 0;
}

/* Checkboxes */
.checkboxes {
  margin-top: 20px;
}

.checkboxes p {
  font-size: 14px;
  margin-bottom: 10px;
}

.checkboxes label {
  font-size: 14px;
  display: block;
  margin-bottom: 10px;
  font-weight: normal;
}

.checkboxes input {
  margin-right: 8px;
}

/* Button */
form button[type="submit"] {
  margin-top: 20px;
  width: 100%;
  background: #6c33f8;
  color: white;
  padding: 14px;
  font-size: 16px;
  border: none;
  border-radius: 30px;
  cursor: pointer;
}

/* Login link */
.login-link {
  text-align: center;
  margin-top: 15px;
  font-size: 14px;
}

.login-link a {
  color: #6c33f8;
  text-decoration: none;
}

    .success-message {
      display: none;
      margin-top: 15px;
      padding: 10px;
      border: 1px solid green;
      background-color: #e6ffe6;
      color: green;
    }
  

@media screen and (max-width: 768px) {
  .form-box {
    padding: 20px;
  }

  .form-box h2 {
    font-size: 22px;
  }

  .popup {
    width: 90%;
    left: 5%;
    right: 5%;
  }
}

@media screen and (max-width: 480px) {
  .help-btn {
    font-size: 12px;
    padding: 8px 16px;
  }

  form button[type="submit"] {
    font-size: 14px;
    padding: 12px;
  }

  .form-box h2 {
    font-size: 20px;
  }
}

    </style>
</head>
<body>
    <script>
    function togglePopup() {
      document.getElementById("popup").classList.toggle("show");
    }
  </script>
    <div class="container">
    <!-- Left Logo -->
     <div class="header">
    <div class="logo">
      <img src="img/makeindia2.png" alt="Make in India Capital PMS" />
    </div>

    <div class="helpline-box">
      <button class="help-btn" onclick="togglePopup()">📞 HELP</button>
      <div class="popup" id="popup">
        <h3>HELPLINE</h3>
        <p>If you are facing any problem in completing online onboarding, please contact our troubleshooter</p>
        <p><strong>Mr. Vilas Sonkusare</strong><br/>+91 80808 20339</p>
        <p><strong>Sumit Panwar</strong><br/>8668592985</p>
        <p><strong>Mayuri Kadu</strong><br/>7972314189</p>
        <button onclick="togglePopup()">Close</button>
      </div>
    </div>
    </div>


    <div class="form-box">
      <h2>Enquiry Form</h2>
      <form action="submit.php" method="POST">
        <label>Name<span>*</span></label>
        <input type="text" placeholder="Enter Your Name" name="name" required />

        <label>Phone<span>*</span></label>
        <div class="phone-box">
          <span>+91</span>
          <input type="tel" placeholder="Phone number" name="phone" required />
        </div>

        <label>Email<span>*</span></label>
        <input type="email" placeholder="Enter your email" name="email" required />

        <label>DOB (DD/MM/YYYY)<span>*</span></label>
        <input type="date" placeholder="DD/MM/YYYY"  name="dob" required />

        <label>Pan Number<span>*</span></label>
        <input type="text" placeholder="Enter your PAN number" name="pan" required />

        <label>PMS Number<span>*</span></label>
        <input type="text" placeholder="Enter your PMS number"  name="pms" required />


        <label>City<span>*</span></label>
        <input type="text" placeholder="Enter your City Name" name="city" required />

        <label for="Message">Your Message<span>*</span></label>
        <textarea  name="message"  placeholder="Enter your Message"  required></textarea>

        <button type="submit">Submit</button>
      </form>
    </div>
    </div>
</body>
</html>
